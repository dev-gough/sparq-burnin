# burnin-dashboard — CI + labserver deploy
#
# Flow: push master → test (Docker) → deploy (host) → systemctl restart
# Manual re-run: workflow_dispatch (Gitea 1.22 — no input forms; deploys master).
# Non-master lab deploys: run the deploy script on the host with BRANCH=...
#
# Requires (same infra as sparq-toolbox — see docs/CI_DEPLOY.md):
#   - Gitea Actions enabled + runner with labels: ubuntu-latest, labserver:host
#   - /home/server/bin/deploy-burnin-dashboard.sh on the lab host
#   - passwordless sudo for systemctl restart burnin-dashboard (user: server)
#
# Note: Gitea 1.22.x rejects workflow_dispatch.inputs (DetectWorkflows:
# "unknown on type") and silently ignores the whole workflow. Keep on: in
# sync with sparq-toolbox — push + bare workflow_dispatch only.

name: CI and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-burnin-dashboard
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy labserver
    needs: test
    runs-on: labserver
    steps:
      - name: Deploy burnin-dashboard
        run: /home/server/bin/deploy-burnin-dashboard.sh
